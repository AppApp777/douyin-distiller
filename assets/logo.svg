<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="douyin-distiller logo">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="55%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0B1020"/>
  <rect width="512" height="512" rx="112" fill="url(#g1)" opacity="0.10"/>

  <!-- 上层：很多视频（散） -->
  <g fill="url(#g1)">
    <rect x="104" y="104" width="46" height="30" rx="7" opacity="0.95"/>
    <rect x="166" y="104" width="46" height="30" rx="7" opacity="0.80"/>
    <rect x="228" y="104" width="46" height="30" rx="7" opacity="0.95"/>
    <rect x="290" y="104" width="46" height="30" rx="7" opacity="0.72"/>
    <rect x="352" y="104" width="46" height="30" rx="7" opacity="0.90"/>
    <rect x="135" y="148" width="46" height="30" rx="7" opacity="0.72"/>
    <rect x="197" y="148" width="46" height="30" rx="7" opacity="0.95"/>
    <rect x="259" y="148" width="46" height="30" rx="7" opacity="0.80"/>
    <rect x="321" y="148" width="46" height="30" rx="7" opacity="0.90"/>
  </g>

  <!-- 漏斗：蒸馏 -->
  <path d="M96 208 H416 L300 336 V420 L212 388 V336 Z"
        fill="none" stroke="url(#g2)" stroke-width="16"
        stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>

  <!-- 漏斗内的收束流 -->
  <g stroke="url(#g1)" stroke-width="9" stroke-linecap="round" opacity="0.65">
    <path d="M150 236 L232 300"/>
    <path d="M256 236 L256 300"/>
    <path d="M362 236 L280 300"/>
  </g>

  <!-- 出口：一滴精华 -->
  <circle cx="256" cy="452" r="18" fill="#22D3EE" filter="url(#soft)"/>
</svg>
