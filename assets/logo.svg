<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     fill="none" role="img" aria-label="douyin-distiller">
  <title>douyin-distiller</title>

  <!-- 原料：六个散点，自上而下收拢 -->
  <g fill="#00A4FC">
    <circle cx="182" cy="104" r="20"/>
    <circle cx="256" cy="104" r="20"/>
    <circle cx="330" cy="104" r="20"/>
    <circle cx="219" cy="154" r="20"/>
    <circle cx="293" cy="154" r="20"/>
    <circle cx="256" cy="204" r="20"/>
  </g>

  <!-- 漏斗：两笔收到一点 -->
  <path d="M120 158 L256 306 L392 158" stroke="#002060" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 出口 -->
  <path d="M256 308 L256 336" stroke="#002060" stroke-width="56"
        stroke-linecap="round"/>

  <!-- 蒸出来的那一滴 -->
  <circle cx="256" cy="402" r="24" fill="#00A4FC"/>
</svg>
